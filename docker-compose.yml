services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: moodmixer-backend
    ports:
      - "4000:8080"
    environment:
      - PORT=8080
      - NODE_ENV=production
    env_file:
      - ./backend/.env
    volumes:
      # Mount service account file
      - ./backend/firebase-service-account.json:/app/firebase-service-account.json:ro
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:8080/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: moodmixer-frontend
    ports:
      - "8081:8081"
    environment:
      - EXPO_PUBLIC_API_URL=http://localhost:4000
      - NODE_ENV=development
      - EXPO_DEVTOOLS_LISTEN_ADDRESS=0.0.0.0
    volumes:
      # Mount source code for hot reload
      - ./frontend/src:/app/src
      - ./frontend:/app
      - /app/node_modules
    restart: unless-stopped
    depends_on:
      - backend

