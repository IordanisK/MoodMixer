services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile.dev
    container_name: moodmixer-backend-dev
    ports:
      - "4000:4000"
    environment:
      - PORT=4000
      - NODE_ENV=development
    env_file:
      - .env
    volumes:
      # Mount source code for hot reload (not read-only for nodemon)
      - ./src:/app/src
      - ./firebase-service-account.json:/app/firebase-service-account.json:ro
      # Exclude node_modules from volume mount
      - /app/node_modules
    restart: unless-stopped

