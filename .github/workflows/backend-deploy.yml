name: Deploy Backend to Cloud Run

on:
  push:
    branches: [main]
    paths:
      - "backend/**"
  workflow_dispatch:

env:
  PROJECT_ID: moodmixer-6bb54
  SERVICE_NAME: moodmixer-backend
  REGION: us-central1
  ARTIFACT_REGISTRY_REPO: moodmixer-repo

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Prepare GCP credentials
        run: |
          if [ -z "${{ secrets.GCP_SA_KEY }}" ]; then
            echo "⚠️  ERROR: GCP_SA_KEY secret is empty or not set!"
            echo ""
            echo "Troubleshooting steps:"
            echo "1. Go to: https://github.com/${{ github.repository }}/settings/secrets/actions"
            echo "2. Verify 'GCP_SA_KEY' exists (exact name, case-sensitive)"
            echo "3. Click 'Update' and ensure the entire JSON content is pasted"
            echo "4. The JSON should start with: {\"type\":\"service_account\",..."
            echo "5. Make sure you copy the ENTIRE file content, including all lines"
            exit 1
          fi
          # Write secret to file to ensure proper formatting
          echo "${{ secrets.GCP_SA_KEY }}" > /tmp/gcp-key.json
          echo "✓ GCP credentials written to file"
          echo "File size: $(wc -c < /tmp/gcp-key.json) bytes"
          # Validate it's valid JSON
          if ! cat /tmp/gcp-key.json | jq . > /dev/null 2>&1; then
            echo "⚠️  WARNING: Secret does not appear to be valid JSON"
          else
            echo "✓ Secret is valid JSON"
          fi

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Create Artifact Registry repository (if not exists)
        run: |
          if ! gcloud artifacts repositories describe $ARTIFACT_REGISTRY_REPO --location=$REGION --format="value(name)" 2>/dev/null; then
            echo "Creating Artifact Registry repository..."
            gcloud artifacts repositories create $ARTIFACT_REGISTRY_REPO \
              --repository-format=docker \
              --location=$REGION \
              --description="Docker repository for MoodMixer backend"
          else
            echo "Artifact Registry repository already exists"
          fi

      - name: Configure Docker for Artifact Registry
        run: gcloud auth configure-docker $REGION-docker.pkg.dev

      - name: Build Docker image
        working-directory: backend
        run: |
          IMAGE_URI="$REGION-docker.pkg.dev/$PROJECT_ID/$ARTIFACT_REGISTRY_REPO/$SERVICE_NAME"
          docker build -t $IMAGE_URI:$GITHUB_SHA .
          docker tag $IMAGE_URI:$GITHUB_SHA $IMAGE_URI:latest

      - name: Push Docker image to Artifact Registry
        run: |
          IMAGE_URI="$REGION-docker.pkg.dev/$PROJECT_ID/$ARTIFACT_REGISTRY_REPO/$SERVICE_NAME"
          docker push $IMAGE_URI:$GITHUB_SHA
          docker push $IMAGE_URI:latest

      - name: Deploy to Cloud Run
        run: |
          IMAGE_URI="$REGION-docker.pkg.dev/$PROJECT_ID/$ARTIFACT_REGISTRY_REPO/$SERVICE_NAME"
          # Base64 encode Firebase service account to avoid JSON escaping issues
          FIREBASE_SA_B64=$(echo -n '${{ secrets.FIREBASE_SERVICE_ACCOUNT }}' | base64 | tr -d '\n')
          # Deploy with environment variables
          gcloud run deploy $SERVICE_NAME \
            --image $IMAGE_URI:$GITHUB_SHA \
            --platform managed \
            --region $REGION \
            --allow-unauthenticated \
            --set-env-vars="PORT=8080,FIREBASE_SERVICE_ACCOUNT_B64=$FIREBASE_SA_B64" \
            --memory=512Mi \
            --cpu=1 \
            --timeout=300 \
            --min-instances=0 \
            --max-instances=10 \
            --port=8080

      - name: Get service URL
        run: |
          SERVICE_URL=$(gcloud run services describe $SERVICE_NAME --region=$REGION --format='value(status.url)')
          echo "Service deployed at: $SERVICE_URL"
          echo "SERVICE_URL=$SERVICE_URL" >> $GITHUB_ENV
