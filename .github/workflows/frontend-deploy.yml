name: Deploy Frontend to Firebase Hosting

on:
  push:
    branches: [main]
    paths:
      - "frontend/**"
  workflow_dispatch:

env:
  PROJECT_ID: moodmixer-6bb54

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write

    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: "frontend/package-lock.json"

      - name: Install dependencies
        run: npm ci

      - name: Build web app
        run: |
          # Use expo export for Metro bundler (expo export:web only works with Webpack)
          npx expo export
          # Expo exports to 'dist' directory, find web output and copy to web-build
          if [ -d "dist" ]; then
            # Check if there's a web subdirectory or if dist contains web files directly
            if [ -d "dist/web" ]; then
              mkdir -p web-build
              cp -r dist/web/* web-build/ 2>/dev/null || cp -r dist/web/. web-build/
              echo "✓ Build output copied from dist/web/ to web-build/"
            elif [ -f "dist/index.html" ] || [ -f "dist/_expo/static/js" ]; then
              mkdir -p web-build
              cp -r dist/* web-build/ 2>/dev/null || cp -r dist/. web-build/
              echo "✓ Build output copied from dist/ to web-build/"
            else
              echo "Error: Could not find web build output in dist/"
              echo "dist/ contents:"
              ls -la dist/
              exit 1
            fi
          else
            echo "Error: dist directory not found after export"
            echo "Current directory contents:"
            ls -la
            exit 1
          fi
        env:
          EXPO_PUBLIC_API_URL: ${{ secrets.EXPO_PUBLIC_API_URL }}

      - name: Setup Firebase CLI
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: "${{ secrets.GITHUB_TOKEN }}"
          firebaseServiceAccount: "${{ secrets.FIREBASE_SERVICE_ACCOUNT }}"
          channelId: live
          projectId: ${{ env.PROJECT_ID }}
