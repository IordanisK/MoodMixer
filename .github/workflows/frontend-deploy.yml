name: Deploy Frontend to Firebase Hosting

on:
  push:
    branches: [ main ]
    paths:
      - "frontend/**"
  workflow_dispatch:

env:
  PROJECT_ID: moodmixer-6bb54

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write

    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "18"
          cache: "npm"
          cache-dependency-path: "frontend/package-lock.json"

      - name: Install dependencies
        run: npm ci

      - name: Build web app
        run: |
          # Use expo export:web (without --output-dir flag which isn't supported)
          npx expo export:web
          # Expo exports to 'dist' directory by default, copy to web-build for Firebase Hosting
          if [ -d "dist" ]; then
            mkdir -p web-build
            cp -r dist/* web-build/ 2>/dev/null || cp -r dist/. web-build/
            echo "✓ Build output copied from dist/ to web-build/"
          elif [ -d "web-build" ]; then
            echo "✓ Build output already in web-build/"
          else
            echo "Error: No build output found"
            echo "Current directory contents:"
            ls -la
            exit 1
          fi
        env:
          EXPO_PUBLIC_API_URL: ${{ secrets.EXPO_PUBLIC_API_URL }}

      - name: Setup Firebase CLI
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: '${{ secrets.GITHUB_TOKEN }}'
          firebaseServiceAccount: '${{ secrets.FIREBASE_SERVICE_ACCOUNT }}'
          channelId: live
          projectId: ${{ env.PROJECT_ID }}
