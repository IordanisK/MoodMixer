services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile.dev
    container_name: moodmixer-backend-dev
    ports:
      - "4000:4000"
    environment:
      - PORT=4000
      - NODE_ENV=development
    env_file:
      - ./backend/.env
    volumes:
      # Mount source code for hot reload
      - ./backend/src:/app/src
      - ./backend/firebase-service-account.json:/app/firebase-service-account.json:ro
      # Exclude node_modules from volume mount
      - /app/node_modules
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: moodmixer-frontend-dev
    ports:
      - "8081:8081"
    environment:
      - EXPO_PUBLIC_API_URL=http://localhost:4000
      - NODE_ENV=development
      - EXPO_DEVTOOLS_LISTEN_ADDRESS=0.0.0.0
    volumes:
      # Mount source code for hot reload
      - ./frontend/src:/app/src
      - ./frontend:/app
      - /app/node_modules
    restart: unless-stopped
    depends_on:
      - backend

